name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macOS-latest, windows-latest]
        nim: [stable, 1.6.18, 2.0.12]
    steps:
    - uses: actions/checkout@v2
      with:
        submodules: true
    - uses: jiro4989/setup-nim-action@v2
      with:
        nim-version: ${{matrix.nim}}
        repo-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Build
      run: nimble install -y
    - name: Test
      run: nimble test -y

  cross-windows:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
      with:
        submodules: true
    - uses: jiro4989/setup-nim-action@v2
      with:
        nim-version: stable
        repo-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Install mingw and wine
      run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64 wine
    - name: Skip the LevelDB setup
      run: mkdir -p build && touch build/Makefile
    - name: Cross-compile to Windows
      run: >
        nim c --os:windows --cpu:amd64
        --gcc.exe:x86_64-w64-mingw32-gcc
        --gcc.linkerexe:x86_64-w64-mingw32-g++
        --passL:-static-libgcc --passL:-static-libstdc++
        leveldbtool.nim
    - name: Run it
      run: WINEDEBUG=-all wine leveldbtool.exe --version
